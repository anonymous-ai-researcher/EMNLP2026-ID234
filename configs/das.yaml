das:
  optimizer: adam
  lr: 5.0e-3
  weight_decay: 0.0
  epochs: 100
  batch_size: 256
  val_split: 0.2
  rotation: cayley
  rank_search: [1, 2, 4, 8]
  layer_search: all
  checkpoint: best_val_iia
  token_position: consumed
  hook: after_block

negative_controls:
  wrong_scm: true
  random_init: true
  shuffled_labels: true

pretrained:
  n_inits: 3
  float_precision: float32
