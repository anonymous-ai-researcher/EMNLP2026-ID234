# From-scratch 2-layer Transformer (Table 8, Appendix C.1)
model:
  type: transformer
  n_layers: 2
  d_model: 128
  n_heads: 4
  d_ff: 512  # 4 * d_model
  activation: gelu
  positional_encoding: learned
  max_seq_len: 25
  vocab_size: 135
  dropout: 0.0
  init: xavier_uniform

training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0
  warmup_steps: 500
  lr_schedule: cosine
  max_steps: 50000
  batch_size: 64
  checkpoint_every: 500
  n_seeds: 5
  loss: cross_entropy

data:
  max_attractor_distance: 8
  train_size: 50000
  val_size: 5000
  test_size: 10000
  balanced: true  # 50% grammatical
  disjoint_lexicon: true
  seed: 42
